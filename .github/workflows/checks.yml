name: Check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
    branches:
      - master

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    name: Preflight
    outputs:
      repository: ${{ steps.repository.outputs.repository }}
      category: ${{ steps.category.outputs.category }}
      run_type: ${{ steps.run_type.outputs.run_type }}
    steps:
      - name: Determine run type
        id: run_type
        env:
          HAS_REMOVAL: ${{ contains(github.event.pull_request.labels.*.name, 'remove-repositories') }}
          HAS_NEW_REPO: ${{ contains(github.event.pull_request.labels.*.name, 'New default repository') }}
          HAS_RENAMED: ${{ contains(github.event.pull_request.labels.*.name, 'renamed-repositories') }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HAS_NEW_REPO" = "true" ]; then
            printf 'run_type=new-repository\n' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_RENAMED" = "true" ]; then
            printf 'run_type=rename\n' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_REMOVAL" = "true" ]; then
            printf 'run_type=removal\n' >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            printf 'run_type=maintenance\n' >> "$GITHUB_OUTPUT"
          else
            printf 'run_type=unknown\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Fetch exact pull request head
        if: steps.run_type.outputs.run_type == 'new-repository' || steps.run_type.outputs.run_type == 'maintenance'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
          actual_head=$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER")
          if [ "$actual_head" != "$HEAD_SHA" ]; then
            echo "::error::The pull request head changed during admission; rerun checks"
            exit 1
          fi

      - name: Reject unlabelled registry data changes
        if: steps.run_type.outputs.run_type == 'maintenance'
        run: python3 -m scripts.changed.maintenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set repository
        id: repository
        if: steps.run_type.outputs.run_type == 'new-repository'
        run: printf 'repository=%s\n' "$(python3 -m scripts.changed.repo)" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Set category
        id: category
        if: steps.run_type.outputs.run_type == 'new-repository'
        run: printf 'category=%s\n' "$(python3 -m scripts.changed.category)" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  owner:
    runs-on: ubuntu-latest
    name: Owner
    needs: preflight
    if: needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.owner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  editable:
    runs-on: ubuntu-latest
    name: Editable PR
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"


      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.edits

  releases:
    runs-on: ubuntu-latest
    name: Releases
    needs: preflight
    if: needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  removed:
    runs-on: ubuntu-latest
    name: Removed repository
    needs: preflight
    if: needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.removed
        env:
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  existing:
    runs-on: ubuntu-latest
    name: Existing repository
    needs: preflight
    if: needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies if needed
        run: scripts/setup

      - name: Run the check
        run: python3 -m scripts.check.existing
        env:
          REPOSITORY: ${{needs.preflight.outputs.repository}}

  hassfest:
    runs-on: ubuntu-latest
    name: Hassfest
    needs: preflight
    if: needs.preflight.outputs.category == 'integration' && needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Clone new addition
        run: |
          git clone --depth 1 "https://github.com/${{needs.preflight.outputs.repository}}" /tmp/repositories/addition

      - name: Run hassfest
        run: |
          integration=$(python3 -m scripts.helpers.integration_path)
          domain=$(python3 -m scripts.helpers.domain)
          docker run --rm \
            -v "$integration":"/github/workspace/$domain" \
            ghcr.io/home-assistant/hassfest:latest

  hacs:
    runs-on: ubuntu-latest
    name: HACS action
    needs: preflight
    if: needs.preflight.outputs.run_type == 'new-repository'
    steps:
      - name: HACS action
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main as of 2026-10-04
        with:
          repository: ${{needs.preflight.outputs.repository}}
          category: ${{needs.preflight.outputs.category}}

  completed:
    runs-on: ubuntu-slim
    name: Action checks completed
    needs:
      - preflight
      - owner
      - editable
      - releases
      - removed
      - existing
      - hassfest
      - hacs
    if: always()
    steps:
      - name: Require the expected admission jobs to succeed
        run: |
          if [ "${{ needs.preflight.outputs.run_type }}" = "maintenance" ]; then
            if [ "${{ needs.preflight.result }}" != "success" ] || \
               [ "${{ needs.editable.result }}" != "success" ]; then
              echo "::error::Trusted maintenance requires successful preflight and editable checks"
              exit 1
            fi
            echo "Trusted same-repository maintenance checks succeeded"
            exit 0
          fi
          if [ "${{ needs.preflight.outputs.run_type }}" != "new-repository" ]; then
            echo "::error::Only new-repository admission and trusted same-repository maintenance are supported"
            exit 1
          fi
          for result in \
            "${{ needs.preflight.result }}" \
            "${{ needs.owner.result }}" \
            "${{ needs.editable.result }}" \
            "${{ needs.releases.result }}" \
            "${{ needs.removed.result }}" \
            "${{ needs.existing.result }}" \
            "${{ needs.hacs.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required admission job did not succeed (result: $result)"
              exit 1
            fi
          done
          if [ "${{ needs.preflight.outputs.category }}" = "integration" ] && \
             [ "${{ needs.hassfest.result }}" != "success" ]; then
            echo "::error::Hassfest is required for integration admission"
            exit 1
          fi
          if [ "${{ needs.preflight.outputs.run_type }}" = "new-repository" ]; then
            echo "All required new-repository admission jobs succeeded"
          fi
