name: Lint
on:
  pull_request_target:
    branches:
      - master
  push:
    branches:
      - master

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jq:
    name: JQ
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Prepare the exact candidate data snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin \
              "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
            actual_head=$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER")
            if [ "$actual_head" != "$HEAD_SHA" ]; then
              echo "::error::The pull request head changed during lint; rerun checks"
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/catalog-data"
          for path in appdaemon blacklist critical integration netdaemon plugin python_script removed template theme; do
            git show "$HEAD_SHA:$path" > "$RUNNER_TEMP/catalog-data/$path"
          done

      - name: Validate candidate JSON
        run: |
          for path in appdaemon blacklist critical integration netdaemon plugin python_script removed template theme; do
            jq --raw-output . "$RUNNER_TEMP/catalog-data/$path" > /dev/null
          done

  jsonschema:
    name: JSON schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Prepare the exact candidate data snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin \
              "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
            actual_head=$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER")
            if [ "$actual_head" != "$HEAD_SHA" ]; then
              echo "::error::The pull request head changed during lint; rerun checks"
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/catalog-data"
          for path in appdaemon blacklist critical integration netdaemon plugin python_script removed template theme; do
            git show "$HEAD_SHA:$path" > "$RUNNER_TEMP/catalog-data/$path"
          done

      - name: Validate trusted catalog schemas
        run: python3 scripts/validate_catalog.py "$RUNNER_TEMP/catalog-data"

      - name: Test trusted admission and catalog validators
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -v

  sorted:
    name: Sorted
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Prepare the exact candidate data snapshot
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin \
              "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
            actual_head=$(git rev-parse "refs/remotes/origin/pr/$PR_NUMBER")
            if [ "$actual_head" != "$HEAD_SHA" ]; then
              echo "::error::The pull request head changed during lint; rerun checks"
              exit 1
            fi
          fi
          mkdir -p "$RUNNER_TEMP/catalog-data"
          for path in appdaemon blacklist critical integration netdaemon plugin python_script removed template theme; do
            git show "$HEAD_SHA:$path" > "$RUNNER_TEMP/catalog-data/$path"
          done

      - name: Check lists
        run: python3 scripts/is_sorted.py "$RUNNER_TEMP/catalog-data"
